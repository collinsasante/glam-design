<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Your design – Packaging Glamour</title>
<style>
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:#f8fafc; color:#1f2937; }
  main { max-width: 560px; margin: 12vh auto 0; padding: 24px; background:#fff; border:1px solid #e5e7eb; border-radius:12px; }
  a { color:#b4235a; }
</style>
</head>
<body>
<main>
  <h1 style="font-size:1.3rem">Your design review has moved</h1>
  <p id="msg">Design reviews now happen on our new system. Please use the link in your latest message from us, or contact us and we will send you a new one.</p>
</main>
<script>
(function () {
  "use strict";
  var q = new URLSearchParams(location.search);
  var order = q.get("order"), key = q.get("key");
  if (order && key && /^ORD-\d{5,}$/.test(order)) {
    location.replace("https://erp.packglamour.com/design-review?" + new URLSearchParams({ order: order, key: key }).toString());
  }
})();
</script>
</body>
</html>
